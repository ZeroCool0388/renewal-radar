name: Evals

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    name: Demo evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_SHARING: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      LLM_PROVIDER: ''
      LLM_MODEL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Eval
        run: npm run eval
